<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer_box{
            width: 400px;
            height: 400px;
            background-color: green;
            padding: 50px;
            box-sizing: border-box;
        }
        .inner_box{
            width: 200px;
            height: 200px;
            background-color: salmon;
            border: 50px solid pink;
        }
    </style>
</head>
<body>
    <div class="outer_box">
        <div class="inner_box"></div>
    </div>
</body>
</html>
