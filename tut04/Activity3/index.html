<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h2>Activity 3 – Rejecting a Promise with Button Click</h2>
    <button id="cancelBtn">Cancel Promise</button>
    <div id="status"></div>
    <script>
        const btn = document.getElementById("cancelBtn");
        const statusDiv = document.getElementById("status");
        let PromiseRun = new Promise((resolve, reject) =>{
            let count = 3;
            const timer = setInterval(() =>{
                count--;
                if(count > 0){
                    statusDiv.textContent = `Promise resolve in ${count} seconds`;
                }else{
                    clearInterval(timer);
                    resolve("Promise has been resolve")
                }
            },1000);

            btn.addEventListener("click", () =>{
                clearInterval(timer);
                reject("Promise can not be resolve");
            })

       })

       PromiseRun.then(msg => statusDiv.textContent = msg).
       catch(msg => statusDiv.textContent = msg);
    </script>
</body>
</html>
